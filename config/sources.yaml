# ============================================================
# 水墨词库采集配置
# 改这里就能换数据源 / 换输出格式，代码不用动
# ============================================================

output:
  dir: data/dict
  encoding: utf-8
  formats:
    # ① 组句词库：词条 <TAB> 拼音 <TAB> 词频（汉字 ≤6 字）
    - type: juzi
      file: shuimo_juzi.txt
      min_freq: 2
      min_len: 2
      max_len: 6
      pinyin_sep: ""        # "" = kaishi；" " = kai shi

    # ② 语料词对：词1 词2 共现次数（两边各 1-4 个汉字）
    - type: bigram
      file: shuimo_bigram.txt
      min_count: 2
      max_word_len: 4
      max_rows: 200000

    # ③ 通用词库（带词性/分类，留着备查）
    - type: raw
      file: shuimo_raw.txt
      template: "{word}\t{freq}\t{pos}\t{cls}"
      min_freq: 2
      split_by_class: true

scoring:
  cap_per_source: 300      # 单词单源封顶，防刷量
  default_weight: 1.0
  half_life_days: 90       # 历史词频衰减半衰期
  max_age_days: 400
  drop_below: 0.8

filter:
  only_chinese: true     # 只收中文词：英文/数字/符号在分词后直接丢
  min_len: 2
  max_len: 12

bigram:
  max_rows: 300000
  min_count_keep: 1

fetch:
  delay: 1.5
  timeout: 25
  retries: 2
  respect_robots: true
  save_raw: true

# ------------------------------------------------------------
# 数据源
#   type: html | rss | bilibili_popular | bilibili_ranking
#         | bilibili_comments | bilibili_danmaku
#   weight: 越大，该源贡献的词频占比越高
#   min_chars / min_cjk: 正文体检阈值（抓歪的页面会被直接丢掉）
# ------------------------------------------------------------
sources:
  # ===== B 站：口语语料主力 =====
  - name: B站-热门列表
    type: bilibili_popular
    pages: 2
    ps: 50
    weight: 1.0
    enabled: true

  - name: B站-排行榜
    type: bilibili_ranking
    rid: 0
    weight: 1.0
    enabled: true

  # 评论区：比标题口语得多，权重给高
  - name: B站-热门视频评论区
    type: bilibili_comments
    videos: 12
    pages: 2
    delay: 0.6
    min_sent: 4
    sentences: false
    min_unique: 0.02       # 评论区天然高重复（"哈哈""来了"），单独放宽
    weight: 1.6
    enabled: true

  # 弹幕：一句话一条，是组句词库最好的原料
  - name: B站-热门视频弹幕
    type: bilibili_danmaku
    videos: 12
    segments: 2
    per_video: 900
    delay: 0.4
    min_sent: 4
    sentences: false
    min_unique: 0.02
    weight: 1.3
    enabled: true

  # ===== RSS：干净正文 =====
  - name: 人民网-时政
    type: rss
    url: http://www.people.com.cn/rss/politics.xml
    weight: 1.3
    enabled: true

  - name: 中国新闻网-滚动
    type: rss
    url: https://www.chinanews.com.cn/rss/scroll-news.xml
    weight: 1.2
    enabled: true

  - name: 澎湃新闻
    type: rss
    url: https://feedx.net/rss/thepaper.xml
    weight: 1.2
    enabled: true

  - name: IT之家
    type: rss
    url: https://www.ithome.com/rss/
    weight: 1.1
    enabled: true

  - name: 少数派
    type: rss
    url: https://sspai.com/feed
    weight: 1.1
    enabled: true

  - name: 爱范儿
    type: rss
    url: https://www.ifanr.com/feed
    weight: 1.0
    enabled: true

  - name: 机核
    type: rss
    url: https://www.gcores.com/rss
    weight: 1.0
    enabled: true

  - name: 阮一峰-科技爱好者周刊
    type: rss
    url: https://feeds.feedburner.com/ruanyifeng
    weight: 1.0
    enabled: true

  - name: Solidot-奇客
    type: rss
    url: https://www.solidot.org/index.rss
    weight: 0.9
    enabled: true

  # ===== HTML：成语/文言，补组句词库的"雅" =====
  - name: 古诗文网
    type: html
    url: https://www.gushiwen.cn/
    weight: 0.8
    min_chars: 300
    min_cjk: 0.5
    enabled: true

  # ===== 备用（探针显示这些地址当前不可用，留着方便换） =====
  - name: 36氪
    type: rss
    url: https://36kr.com/feed
    weight: 1.0
    enabled: false

  - name: 虎嗅
    type: rss
    url: https://www.huxiu.com/rss/0.xml
    weight: 1.0
    enabled: false

  # ⚠️ 示例源：只用于本地调试
  - name: 示例-本地页面
    type: html
    url: data/sample.html
    weight: 1.0
    enabled: false
