# ============================================================
# 水墨词库采集配置
# 改这里就能换数据源 / 换输出格式，代码不用动
# ============================================================

output:
  dir: data/dict
  encoding: utf-8
  formats:
    # ① 组句词库：词条 <TAB> 拼音 <TAB> 词频（汉字 ≤6 字）
    - type: juzi
      file: shuimo_juzi.dict
      min_freq: 2
      min_len: 2
      max_len: 6
      pinyin_sep: ""        # "" = kaishi；" " = kai shi

    # ② 语料词对：词1 词2 共现次数（两边各 1-4 个汉字）
    - type: bigram
      file: shuimo_bigram.txt
      min_count: 2
      max_word_len: 4
      max_rows: 200000

    # ③ 通用词库（带词性/分类，留着备查）
    - type: raw
      file: shuimo.dict
      template: "{word}\t{freq}\t{pos}\t{cls}"
      min_freq: 2
      split_by_class: true

scoring:
  cap_per_source: 300      # 单词单源封顶，防刷量
  default_weight: 1.0
  half_life_days: 90       # 历史词频衰减半衰期
  max_age_days: 400
  drop_below: 0.8

bigram:
  max_rows: 300000
  min_count_keep: 1

fetch:
  delay: 1.5
  timeout: 25
  retries: 2
  respect_robots: true
  save_raw: true

# ------------------------------------------------------------
# 数据源
#   type: html | rss | bilibili_popular | bilibili_ranking
#         | bilibili_danmaku | bilibili_view
#   weight: 越大，这个词在最终词频里占比越高
# ------------------------------------------------------------
sources:
  # ===== B 站：口语语料的主力 =====
  - name: B站-热门列表
    type: bilibili_popular
    pages: 2
    ps: 50
    weight: 1.0
    enabled: true

  - name: B站-排行榜
    type: bilibili_ranking
    rid: 0
    weight: 1.0
    enabled: true

  # 弹幕都是一两句的短句，单独把断句阈值降到 4 字
  - name: B站-热门弹幕
    type: bilibili_danmaku
    videos: 15
    per_video: 600
    delay: 0.4
    min_sent: 4
    sentences: false        # 弹幕不需要句子库，跳过断句省时间
    weight: 1.2
    enabled: true

  # ===== RSS：干净正文，替代抓首页 =====
  - name: 少数派
    type: rss
    url: https://sspai.com/feed
    weight: 1.3
    enabled: true

  - name: 中国新闻网-滚动
    type: rss
    url: https://www.chinanews.com.cn/rss/scroll-news.xml
    weight: 1.2
    enabled: true

  - name: 阮一峰-科技爱好者周刊
    type: rss
    url: https://feeds.feedburner.com/ruanyifeng
    weight: 1.0
    enabled: true

  # ===== 备用：想加就改 enabled =====
  - name: 36氪
    type: rss
    url: https://36kr.com/feed
    weight: 1.0
    enabled: false

  - name: 人民网-首页
    type: html
    url: http://www.people.com.cn/
    weight: 1.0
    enabled: false

  # ⚠️ 示例源：只用于本地调试，别开着上生产
  - name: 示例-本地页面
    type: html
    url: data/sample.html
    weight: 1.0
    enabled: false
